name: tactic-weaver
services:
  tactic-weaver:
    image: tactic-weaver:local
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-slim}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4173'
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    ports:
      - '127.0.0.1:4173:4173'
    networks:
      - gateway
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
networks:
  gateway:
    external: true
